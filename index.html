<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taškų lenta</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taškai">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bungee&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: one phone-width column; dark LED scoreboard on top, court-orange "next shot" card, task rows below. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e4e9f1; --ink:#14213d; --ink-soft:#56627d; --line:#d4dbe7;
  --accent:#e8681f; --accent-ink:#ffffff; --accent-soft:#fde3d2;
  --good:#1d9459; --good-soft:#d6f1e2; --bad:#c8372d; --bad-soft:#fbe0dd; --gold:#c98a00; --gold-soft:#fff1c9;
  --wood:#e9c48f; --board:#0f1626; --board-line:#26314a; --led:#ffb21f; --led-soft:#8a6a2a; --board-ink:#d8e0f0;
  --shadow:0 1px 2px rgba(20,33,61,.08),0 6px 18px rgba(20,33,61,.08);
  --f-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-led:"Bungee","Baloo 2",ui-monospace,monospace;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#151e34; --surface-2:#1d2843; --ink:#e9eef8; --ink-soft:#9eabc7; --line:#28344f;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --good:#3ccf86; --good-soft:#133524; --bad:#ff6b5e; --bad-soft:#3a1714; --gold:#ffc53d; --gold-soft:#3a2d0c;
  --wood:#7a5a33; --board:#060a14; --board-line:#1e2840; --led:#ffb21f; --led-soft:#7a5d22; --board-ink:#c9d3e8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#151e34; --surface-2:#1d2843; --ink:#e9eef8; --ink-soft:#9eabc7; --line:#28344f;
  --accent:#ff7a2e; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --good:#3ccf86; --good-soft:#133524; --bad:#ff6b5e; --bad-soft:#3a1714; --gold:#ffc53d; --gold-soft:#3a2d0c;
  --wood:#7a5a33; --board:#060a14; --board-line:#1e2840; --led:#ffb21f; --led-soft:#7a5d22; --board-ink:#c9d3e8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:30px;line-height:1.05}
.top p{margin:2px 0 0;color:var(--ink-soft);font-weight:700}
.sync{font-size:12px;color:var(--ink-soft);font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.off i{background:var(--bad)}
.sync.wait i{background:var(--gold)}

/* Scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.board-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#8d9abb}
.led{font-family:var(--f-led);color:var(--led);text-shadow:0 0 14px rgba(255,178,31,.35);font-variant-numeric:tabular-nums;line-height:1}
.score{display:flex;align-items:baseline;gap:6px}
.score .led{font-size:64px}
.score .of{font-family:var(--f-led);font-size:24px;color:var(--led-soft)}
.screen{text-align:right}
.screen .led{font-size:34px}
.screen small{display:block;font-size:12px;color:#8d9abb;font-weight:700;margin-top:4px}
.segs{display:flex;gap:3px;height:16px}
.seg{flex:1 1 0;border-radius:4px;background:var(--board-line);transition:background .35s}
.seg.on{background:var(--led)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--board-line);color:var(--board-ink);font-variant-numeric:tabular-nums}
.chip.plus{background:#1d3b2c;color:#7ff0b4}
.chip.minus{background:#45201d;color:#ffaaa2}
.allwin{font-family:var(--f-display);font-size:20px;color:var(--led);text-align:center}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.wd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:16px;color:var(--ink-soft);border:2px solid transparent}
.wd.star b{background:var(--gold-soft);color:var(--gold)}
.wd.miss b{background:var(--bad-soft);color:var(--bad)}
.wd.today b{border-color:var(--accent)}
.wd.today{color:var(--ink)}

/* Info cards */
.info{display:grid;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.card .ic{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.card .tx{min-width:0;flex:1}
.card h3{font-size:18px}
.card p{margin:2px 0 0;color:var(--ink-soft);font-weight:700;font-size:14px}
.card.warn{background:var(--bad-soft)}
.card.warn h3{color:var(--bad)}
.card.gold{background:var(--gold-soft)}
.lessons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding:0;list-style:none;counter-reset:l}
.lessons li{counter-increment:l;font-size:13px;font-weight:800;background:var(--surface-2);border-radius:8px;padding:3px 8px}
.lessons li::before{content:counter(l) ". ";color:var(--ink-soft)}
.note{font-size:12px;color:var(--ink-soft);font-weight:700}
.linkbtn{border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px;border-radius:10px;padding:6px 10px;margin-top:8px;min-height:36px}
/* Timetable */
.tt{display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
.tt-day{background:var(--surface);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.tt-day .dn{font-family:var(--f-display);font-size:20px;line-height:1.3;width:34px;flex:none;color:var(--ink-soft)}
.tt-day .tx{flex:1;min-width:0}
.tt-day .lessons{margin:2px 0 0}
.tt-day .tag{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;margin:6px 6px 0 0;background:var(--gold-soft);color:var(--gold)}
.tt-day.today{outline:3px solid var(--accent);outline-offset:-3px}
.tt-day.today .dn{color:var(--accent)}
.tt-day.past{opacity:.6}

/* Focus card */
.focus{background:var(--surface);border:3px solid var(--accent);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.focus .lbl{color:var(--accent)}
.focus-title{display:flex;gap:12px;align-items:center}
.focus-title .ic{font-size:44px;line-height:1}
.focus-title h2{font-size:26px;line-height:1.1}
.focus-title .pts{margin-left:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.big{flex:1 1 180px;min-height:60px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:22px;padding:10px 16px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big:disabled{opacity:.45;cursor:not-allowed}
.ghost{flex:0 1 auto;min-height:60px;border:2px solid var(--line);background:var(--surface);border-radius:16px;font-weight:800;padding:8px 14px}
.timer{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.timer .led{color:var(--accent);text-shadow:none;font-size:34px}
.timer .ghost{min-height:44px;margin-left:auto}
.pts{font-family:var(--f-display);font-size:18px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:4px 10px;white-space:nowrap}

/* Task list */
.part{display:flex;flex-direction:column;gap:8px}
.part h2{font-size:20px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.part h2 span{font-family:var(--f-body);font-size:13px;font-weight:800}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:10px 12px;min-height:64px;box-shadow:var(--shadow)}
.task .ic{font-size:28px;width:36px;text-align:center;flex:none}
.task .t{flex:1;min-width:0;font-weight:800;font-size:17px;line-height:1.2}
.task .t small{display:block;font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:2px}
.task .ck{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-weight:900;color:transparent}
.task.done{background:var(--good-soft);box-shadow:none}
.task.done .t{color:var(--good)}
.task.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.task.done .pts{background:transparent;color:var(--good)}
.task.next{outline:3px solid var(--accent);outline-offset:-3px}

/* Sheet */
.veil{position:fixed;inset:0;background:rgba(6,10,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head h2{font-size:24px;flex:1}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:22px;font-weight:900}
.step{font-family:var(--f-display);font-size:16px;color:var(--ink-soft)}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 12px;min-height:58px;border:0;width:100%;text-align:left;box-shadow:var(--shadow)}
.row .ck{width:30px;height:30px;border-radius:8px;border:3px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;font-weight:900}
.row.on{background:var(--good-soft);box-shadow:none}
.row.on .ck{background:var(--good);border-color:var(--good);color:#fff}
.row .t{flex:1;min-width:0;font-weight:800}
.rowbtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;font:inherit;color:inherit;min-height:40px}
.row a{font-weight:800;color:var(--accent);text-decoration:none;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--accent-soft);white-space:nowrap}
.row .del{border:0;background:transparent;font-size:20px;color:var(--ink-soft);width:36px;height:36px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
textarea{min-height:96px;resize:vertical}
.small-btn{border:0;background:var(--ink);color:var(--bg);font-weight:800;border-radius:12px;padding:0 16px;min-height:48px;white-space:nowrap}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.hint{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.lrow{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border:3px solid transparent}
.lrow.none{background:var(--good-soft);box-shadow:none}
.lrow.hw{border-color:var(--gold)}
.lrow.todo{border-color:var(--line);border-style:dashed}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lhead .ln{flex:1 1 120px;font-weight:900;font-size:17px}
.lseg{display:flex;gap:6px}
.lseg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:6px 12px;font-weight:800;font-size:15px}
.lseg button.on.n{background:var(--good);border-color:var(--good);color:#fff}
.lseg button.on.h{background:var(--gold);border-color:var(--gold);color:#fff}
.bgroup{display:flex;flex-direction:column;gap:8px}
.bg-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;margin-top:4px}
.bg-h span{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.bg-h.full span{color:var(--good)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;font-weight:800;box-shadow:var(--shadow);max-width:calc(100% - 32px);width:max-content}
.toast button{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:900}
.fly{position:fixed;z-index:70;font-family:var(--f-led);color:var(--led);font-size:34px;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.3);animation:fly 1.1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-90px) scale(1.4)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65}

/* Parent */
.tabs{display:flex;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:19px}
.panel p{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--ink-soft)}
.trow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.tline{display:grid;grid-template-columns:56px 1fr;gap:8px}
.tline .ico{text-align:center;padding:8px 4px;font-size:22px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.days{display:flex;flex-wrap:wrap;gap:4px}
.days button{border:2px solid var(--line);background:var(--surface);border-radius:8px;min-width:38px;flex:1;min-height:36px;font-weight:800;font-size:13px}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.danger{border:0;background:var(--bad-soft);color:var(--bad);font-weight:800;border-radius:10px;padding:8px 12px}
.sums{display:flex;flex-wrap:wrap;gap:6px}
.sums span{font-weight:800;font-size:13px;border-radius:8px;padding:4px 8px;background:var(--good-soft);color:var(--good)}
.sums span.bad{background:var(--bad-soft);color:var(--bad)}
.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.hist th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.hist td.n{text-align:right;font-weight:800}
.tablebox{overflow-x:auto}
.ok{color:var(--good);font-weight:800}
.no{color:var(--bad);font-weight:800}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{flex:1;min-width:0;font-size:13px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:center}
.savebar .big{max-width:420px}
.ptask{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ptask:first-of-type{border-top:0}
.ptask .t{flex:1;min-width:0;font-weight:800}
.ptask .t small{display:block;color:var(--ink-soft);font-weight:700}
.toggle{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;min-width:92px}
.toggle.on{background:var(--good);border-color:var(--good);color:#fff}
.center{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.big,.pts,.step,.allwin{font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="center"><h2>Kraunama…</h2></div></div>
<div id="sheet" class="veil" hidden></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>
<script>
(function(){
'use strict';
const SB_URL='https://ozpysqtpvtwqkhfoqmzg.supabase.co';
const SB_KEY='sb_publishable_nFOPH_IJkCf6O_ZyWqXX5w_i_YJl5kb';

const DAY_SHORT=['Sk','Pr','An','Tr','Kt','Pn','Št'];
const DAY_LONG=['Sekmadienis','Pirmadienis','Antradienis','Trečiadienis','Ketvirtadienis','Penktadienis','Šeštadienis'];
const MONTHS=['sausio','vasario','kovo','balandžio','gegužės','birželio','liepos','rugpjūčio','rugsėjo','spalio','lapkričio','gruodžio'];
const PARTS=[{id:'rytas',label:'Rytas'},{id:'diena',label:'Diena'},{id:'vakaras',label:'Vakaras'}];
const TYPES={simple:'Paprasta',check:'ND tikrinimas',hw:'ND darymas',bag:'Kuprinės krovimas',train:'Krepšinio krepšys'};
const SYSTEMS=[{id:'tamo',label:'TAMO',url:'https://dienynas.tamo.lt'},{id:'eduka',label:'Eduka',url:'https://klase.eduka.lt'},{id:'gc',label:'Google Classroom',url:'https://classroom.google.com'}];
const WEEK_ORDER=[1,2,3,4,5,6,0];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};

const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);

function plural(n,one,few,many){const a=Math.abs(n)%10,b=Math.abs(n)%100;if(a===1&&b!==11)return one;if(a>=2&&a<=9&&(b<10||b>=20))return few;return many}

async function rpc(fn,args){
  if(DEMO){
    if(fn==='tl_load')return{role:ROLE,config:C||{},days:D,tg:{token:false,chats:0}};
    return null;
  }
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const err=new Error(m||('HTTP '+r.status));err.status=r.status;throw err}
  const t=await r.text();return t?JSON.parse(t):null;
}

/* ---------- rules ---------- */
function blank(){return{done:{},checks:{},hw:[],bag:{},les:{}}}
function rec(k,create){let r=D[k];if(!r){r=blank();if(create)D[k]=r}r.done=r.done||{};r.checks=r.checks||{};r.hw=r.hw||[];r.bag=r.bag||{};r.les=r.les||{};return r}
function trainingAt(dow){return (C.training&&C.training[String(dow)])||''}
function partOf(t,dow){if(t.type==='train'){const tm=trainingAt(dow)||'12:00';return tm<'12:00'?'rytas':'diena'}return t.part}
const partIdx=p=>Math.max(0,PARTS.findIndex(x=>x.id===p));
function tasksFor(d){
  const dow=d.getDay();
  return C.tasks.map((t,i)=>({t,i})).filter(({t})=>t.type==='train'?!!trainingAt(dow):(t.days||[]).includes(dow))
    .sort((a,b)=>partIdx(partOf(a.t,dow))-partIdx(partOf(b.t,dow))||a.i-b.i).map(x=>x.t);
}
const isPerfect=k=>!!(D[k]&&D[k].allDone===true);
function penaltyFor(d){
  let n=0;
  for(let i=1;i<=40;i++){const k=keyOf(addDays(d,-i));if(k<(C.startDate||'9999'))break;if(isPerfect(k))break;n++}
  const step=+C.penaltyStep||0,max=+C.penaltyMax||0;
  return{n,amount:Math.min(step*n,max),next:Math.min(step*(n+1),max)};
}
function satWindowCount(d){
  // Saturday S counts perfect days in [S-7, S-1]
  const dow=d.getDay();
  if(dow===6){let c=0;for(let i=1;i<=7;i++){const k=keyOf(addDays(d,-i));if(k>=C.startDate&&isPerfect(k))c++}return{c,final:true}}
  const sat=addDays(d,6-dow);let c=0;
  for(let x=addDays(sat,-7);x<=d;x=addDays(x,1)){const k=keyOf(x);if(k>=C.startDate&&isPerfect(k))c++}
  return{c,final:false};
}
function summarize(k){
  const d=fromKey(k),r=rec(k),ts=tasksFor(d),dow=d.getDay();
  let sum=0;const missing=[];
  ts.forEach(t=>{if(r.done[t.id])sum+=(+t.pts||0);else missing.push(t.title)});
  const max=+C.dailyMax||30,earned=Math.min(sum,max),allDone=ts.length>0&&missing.length===0;
  let sat=0,sun=0,satDays=0;
  if(dow===6){satDays=satWindowCount(d).c;sat=satDays*(+C.satBonusPerDay||0)}
  if(dow===0){const hwT=ts.find(t=>t.type==='hw');if(hwT&&r.done[hwT.id]){const n=hwItems(r,d).filter(h=>h.done).length;sun=Math.max(1,n)*(+C.sunHwBonus||0)}}
  const pen=penaltyFor(d);
  const screen=Math.max(0,earned+sat+sun-pen.amount);
  return{ts,sum,earned,max,allDone,missing,sat,sun,satDays,pen,screen};
}
function stamp(k){
  const r=rec(k,true),s=summarize(k);
  Object.assign(r,{earned:s.earned,max:s.max,allDone:s.allDone,missing:s.missing,screen:s.screen,bonus:s.sat+s.sun,penalty:s.pen.amount,nextPenalty:s.allDone?0:s.pen.next});
  return s;
}

/* ---------- sync ---------- */
async function loadServer(){
  try{
    const res=await rpc('tl_load',{p_key:KEY});
    ROLE=res.role;
    const cfg=res.config&&res.config.tasks?res.config:null;
    if(cfg)C=cfg;else if(!C)C=defaultConfig();
    if(!cfg&&ROLE==='parent'&&!DEMO){await rpc('tl_save_config',{p_key:KEY,p_config:C})}
    const sd=res.days||{};
    Object.keys(sd).forEach(k=>{if(!pending[k])D[k]=sd[k]});
    if(res.tg)TG=res.tg;
    if(res.childKey)CHILD_KEY=res.childKey;
    syncState='ok';
    await flush();
  }catch(e){
    if(e.message==='bad_key'){showBadKey();return false}
    syncState='off';
  }
  if(!C)C=defaultConfig();
  cacheSave();
  return true;
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{
    for(const k of Object.keys(pending)){
      const ev=pending[k]===true?null:pending[k];
      await rpc('tl_save_day',{p_key:KEY,p_day:k,p_rec:D[k],p_event:ev});
      delete pending[k];
    }
    syncState='ok';
  }catch(e){syncState='off'}
  flushing=false;cacheSave();paintSync();
}
function saveDay(k,event){
  stamp(k);
  const prev=pending[k];
  // keep the newest message; merge if two pile up offline
  pending[k]=event?(typeof prev==='string'&&prev?prev+'\n'+event:event):(prev||true);
  cacheSave();flush();
}
function paintSync(){const el=document.getElementById('sync');if(!el)return;el.className='sync'+(syncState==='off'?' off':syncState==='wait'?' wait':'');el.lastChild.textContent=syncState==='off'?' Nėra ryšio':syncState==='wait'?' Jungiama…':(DEMO?' Demo':' Išsaugota')}

/* ---------- helpers for child ---------- */
const name=()=>C.childName||'Vaikas';
function nextSchoolDay(d){let x=addDays(d,1);for(let i=0;i<7&&!(x.getDay()>=1&&x.getDay()<=5);i++)x=addDays(x,1);return x}
function lessonsOf(d){return (C.timetable&&C.timetable[String(d.getDay())])||[]}
function schoolLessons(d){return [...new Set(lessonsOf(nextSchoolDay(d)))]}
function lessonMap(q){return (q||C).lessonItems||defaultConfig().lessonItems}
function itemsForLesson(l){const m=lessonMap(),n=l.trim().toLowerCase(),key=Object.keys(m).find(x=>x.trim().toLowerCase()===n);return key&&m[key]&&m[key].length?m[key]:['Knygos ir sąsiuviniai']}
function hwItems(r,d){
  return schoolLessons(d).filter(l=>r.les[l]&&r.les[l].s==='hw').map(l=>({kind:'les',l,text:r.les[l].text||'',done:!!r.les[l].done}))
    .concat(r.hw.map((h,i)=>({kind:'x',i,text:h.text,done:!!h.done})));
}
function lessonsMarked(r,d){const ls=schoolLessons(d);return{ls,m:ls.filter(l=>r.les[l]&&r.les[l].s).length}}
function bagGroups(d){
  const g=schoolLessons(d).map(l=>({title:l,icon:'📘',items:itemsForLesson(l).map(it=>({key:l+' · '+it,label:it}))}));
  if((C.bagExtras||[]).length)g.push({title:'Visada kuprinėje',icon:'🎒',items:C.bagExtras.map(it=>({key:it,label:it}))});
  return g;
}
function curPart(){const h=new Date().getHours();return h<12?0:h<17?1:2}
function nextTask(ts,r,dow){
  const undone=ts.filter(t=>!r.done[t.id]);if(!undone.length)return null;
  const cp=curPart();return undone.find(t=>partIdx(partOf(t,dow))>=cp)||undone[0];
}
function sub(t,r,d){
  const dow=d.getDay();
  if(t.type==='train')return 'Treniruotė '+trainingAt(dow);
  if(t.type==='check'){const n=SYSTEMS.filter(s=>r.checks[s.id]).length,lm=lessonsMarked(r,d);return 'Sistemos '+n+'/3'+(lm.ls.length?' · pamokos '+lm.m+'/'+lm.ls.length:'')}
  if(t.type==='hw'){const it=hwItems(r,d),n=it.length,lm=lessonsMarked(r,d);return n?it.filter(h=>h.done).length+' iš '+n+' padaryta':(lm.ls.length&&lm.m===lm.ls.length?'Rytojui nieko neužduota':'Pirma patikrink, kas užduota')}
  if(t.type==='bag'){const it=bagItems(d);return 'Sudėta '+it.filter(x=>r.bag[x]).length+' iš '+it.length+' · '+DAY_LONG[nextSchoolDay(d).getDay()].toLowerCase()}
  if(t.timer)return 'Laikmatis '+t.timer+' min';
  return '';
}
function trainingText(d){
  const tm=trainingAt(d.getDay());if(!tm)return null;
  const [h,m]=tm.split(':').map(Number);const st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);
  const now=new Date(),diff=Math.round((st-now)/60000);
  if(keyOf(d)!==keyOf(today()))return 'Treniruotė '+tm;
  if(diff>0){const hh=Math.floor(diff/60),mm=diff%60;return 'Iki treniruotės liko '+(hh?hh+' val. ':'')+mm+' min'}
  if(diff>-90)return 'Treniruotė vyksta dabar';
  return 'Treniruotė jau baigėsi. Šaunuolis!';
}

  const chips=[];
  if(s.sat)chips.push('<span class="chip plus">Savaitės premija +'+s.sat+' min</span>');
  if(s.sun)chips.push('<span class="chip plus">Už namų darbus +'+s.sun+' min</span>');
  if(s.pen.amount)chips.push('<span class="chip minus">Bauda −'+s.pen.amount+' min</span>');
  return '<section class="board" aria-label="Taškų lenta">'+
    '<div class="board-row"><div><div class="lbl">Taškai šiandien</div><div class="score"><span class="led" id="score">'+s.earned+'</span><span class="of">/'+s.max+'</span></div></div>'+
    '<div class="screen"><div class="lbl">Ekrano laikas</div><div class="led">'+s.screen+'<span style="font-size:18px"> min</span></div></div></div>'+
    (showSegs&&s.ts.length?'<div class="segs" aria-hidden="true">'+segs+'</div>':'')+

    (chips.length?'<div class="chips">'+chips.join('')+'</div>':'')+
  '</section>';
}
function weekHTML(d){
  const mon=addDays(d,-((d.getDay()+6)%7));const tk=keyOf(today());
  return '<section class="week" aria-label="Savaitė">'+WEEK_ORDER.map((_,i)=>{
    const x=addDays(mon,i),k=keyOf(x);let cls='wd',sym='·';
    if(isPerfect(k)){cls+=' star';sym='★'}

    return '<div class="'+cls+'"><b>'+sym+'</b>'+DAY_SHORT[x.getDay()]+'</div>';
  }).join('')+'</section>';

/* ---------- actions ---------- */
function markDone(id,extra){
  const k=keyOf(today()),r=rec(k,true),t=C.tasks.find(x=>x.id===id);if(!t||r.done[id])return;
  r.done[id]=Date.now();
  const before=summarize(k);
  const s=stamp(k);
  let ev=null;
  if(ROLE==='child'){
    ev='✅ '+name()+': '+t.title+' (+'+t.pts+')'+(extra?'\n'+extra:'')+'\nŠiandien '+s.earned+'/'+s.max+' taškų.';
    if(s.allDone)ev+='\n🏆 Visos dienos užduotys atliktos! Ekrano laikas šiandien: '+s.screen+' min.';
  }
  saveDay(k,ev);
  undoInfo={id,k};
  fly('+'+t.pts);ding(s.allDone);
  if(s.allDone&&!before.allDone)confetti();
  toast(s.allDone?'Visos užduotys atliktos! 🏆':'Šaunuolis! +'+t.pts+' '+plural(t.pts,'taškas','taškai','taškų'),true);
  if(timer&&timer.id===id)timer=null;
  render();
}
function undo(){
  if(!undoInfo)return;const {id,k}=undoInfo;undoInfo=null;const r=rec(k,true),t=C.tasks.find(x=>x.id===id);
  delete r.done[id];
  saveDay(k,ROLE==='child'&&t?'↩️ '+name()+' atšaukė: '+t.title:null);
  hideToast();render();
}
function fly(txt){const s=document.getElementById('score');if(!s)return;const b=s.getBoundingClientRect();const f=document.createElement('div');f.className='fly';f.textContent=txt;f.style.left=(b.left+b.width/2)+'px';f.style.top=(b.top)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1200)}
let tt=null;
function toast(msg,withUndo){const el=document.getElementById('toast');el.innerHTML='<span>'+esc(msg)+'</span>'+(withUndo?'<button data-act="undo">Atšaukti</button>':'');el.hidden=false;clearTimeout(tt);tt=setTimeout(hideToast,withUndo?6000:3000)}
function hideToast(){document.getElementById('toast').hidden=true}
let actx=null;
function ding(big){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const notes=big?[523,659,784,1047]:[660,880];notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,actx.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.09+.3);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*.09);o.stop(actx.currentTime+i*.09+.32)})}catch(e){}}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti');c.hidden=false;c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');
  const cols=['#e8681f','#ffb21f','#1d9459','#14213d','#4f7cff'];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-4,s:6+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(step);else{c.hidden=true}})();
}

    linkBox('child-link',childLink())+
    '<p class="note">Tėvų nuoroda yra ši, kurią dabar naudojate. Neduokite jos vaikui.</p></div>';
  h+='<div style="height:20px"></div><div class="savebar"><button class="big" data-act="save-config" '+(dirty?'':'disabled')+'>'+(dirty?'Išsaugoti nustatymus':'Viskas išsaugota')+'</button></div>';
  return h;
}
function fld(label,f,v,type,ph){return '<label class="f">'+label+'<input type="'+type+'" id="cf-'+f+'" data-cf="'+f+'" value="'+esc(v==null?'':v)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'></label>'}
function linkBox(id,url){return '<div class="linkbox"><input type="text" id="'+id+'" readonly value="'+esc(url)+'"><button class="small-btn" data-act="copy" data-target="'+id+'">Kopijuoti</button></div>'}
function childLink(){return location.origin+location.pathname+'?k='+(DEMO?'demo':CHILD_KEY)}
function parentTg(){
  let h='<div class="panel"><h3>Telegram pranešimai</h3>';
  h+='<p>Būsena: '+(TG.token&&TG.chats?'<span class="ok">Prijungta ('+TG.chats+' '+plural(TG.chats,'gavėjas','gavėjai','gavėjų')+')</span>':'<span class="no">Neprijungta</span>')+'</p>';
  h+='<p class="note">Gausite žinutę, kai '+esc(name())+' atliks užduotį, ir dienos suvestinę 20:30.</p></div>';
  h+='<div class="panel"><h3>1. Sukurkite botą</h3><p>Telegram programėlėje suraskite <b>@BotFather</b>, parašykite <b>/newbot</b>, sugalvokite pavadinimą (pvz. „Taškų lenta“) ir vardą, kuris baigiasi „bot“. BotFather atsiųs raktą (token).</p>'+
    '<label class="f">Boto raktas (token)<input type="text" id="tg-token" placeholder="123456789:AA…" autocomplete="off"></label></div>';
  h+='<div class="panel"><h3>2. Parašykite botui</h3><p>Abu tėvai Telegram atidarykite savo naują botą ir paspauskite <b>Start</b> (arba parašykite bet ką).</p>'+
    '<button class="ghost" data-act="tg-find">Rasti, kas parašė botui</button><div id="tg-found"></div></div>';
  return h;
}

/* ---------- parent actions ---------- */
let tgFound=[];
async function tgFind(){
  const tok=(document.getElementById('tg-token').value||'').trim();const box=document.getElementById('tg-found');
  if(!/^\d+:[\w-]{20,}$/.test(tok)){box.innerHTML='<p class="no">Raktas atrodo neteisingas. Jis atrodo taip: 123456789:AAH…</p>';return}
  box.innerHTML='<p class="note">Ieškoma…</p>';
  try{
    const r=await fetch('https://api.telegram.org/bot'+tok+'/getUpdates');const j=await r.json();
    if(!j.ok)throw new Error(j.description||'Klaida');
    const m=new Map();(j.result||[]).forEach(u=>{const msg=u.message||u.my_chat_member||u.edited_message;const ch=msg&&msg.chat;if(ch)m.set(String(ch.id),[ch.first_name,ch.last_name,ch.title].filter(Boolean).join(' ')||String(ch.id))});
    tgFound=[...m.entries()];
    if(!tgFound.length){box.innerHTML='<p class="no">Niekas dar neparašė botui. Atidarykite botą Telegram, paspauskite Start ir bandykite dar kartą.</p>';return}
    box.innerHTML='<p>Rasti gavėjai:</p>'+tgFound.map(([id,n],i)=>'<label class="row on" style="box-shadow:none"><input type="checkbox" id="tgc-'+i+'" data-tgc="'+esc(id)+'" checked style="width:24px;height:24px"> <span class="t">'+esc(n)+'</span></label>').join('')+'<button class="big" data-act="tg-save">Prijungti ir išsiųsti bandomąją žinutę</button>';
  }catch(e){box.innerHTML='<p class="no">Nepavyko: '+esc(e.message)+'</p>'}
}
async function tgSave(){
  const tok=(document.getElementById('tg-token').value||'').trim();
  const chats=[...document.querySelectorAll('[data-tgc]')].filter(x=>x.checked).map(x=>x.dataset.tgc);
  const box=document.getElementById('tg-found');
  try{await rpc('tl_set_telegram',{p_key:KEY,p_token:tok,p_chats:chats});await rpc('tl_test_telegram',{p_key:KEY});TG={token:true,chats:chats.length};cacheSave();box.innerHTML='<p class="ok">Prijungta! Patikrinkite Telegram, turėjo ateiti žinutė.</p>'}
  catch(e){box.innerHTML='<p class="no">Nepavyko išsaugoti: '+esc(e.message)+'</p>'}
}
async function saveConfig(){
  const q=draft;
  ['dailyMax','satBonusPerDay','sunHwBonus','penaltyStep','penaltyMax'].forEach(f=>q[f]=Math.max(0,parseInt(q[f],10)||0));
  q.tasks.forEach(t=>{t.pts=Math.max(0,parseInt(t.pts,10)||0);t.timer=Math.max(0,parseInt(t.timer,10)||0)});
  try{await rpc('tl_save_config',{p_key:KEY,p_config:q});C=JSON.parse(JSON.stringify(q));dirty=false;draft=null;cacheSave();toast('Nustatymai išsaugoti');renderParent()}
  catch(e){toast('Nepavyko išsaugoti: '+e.message)}
}
function markDirty(){dirty=true;const b=document.querySelector('[data-act="save-config"]');if(b){b.disabled=false;b.textContent='Išsaugoti nustatymus'}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,k=keyOf(today());
  if(a==='task'){const t=C.tasks.find(x=>x.id===el.dataset.id);const r=rec(k);if(['check','hw','bag'].includes(t.type))openSheet(t.id);else if(r.done[t.id]){undoInfo={id:t.id,k};toast('Jau atlikta ✓',true)}else markDone(t.id);return}
  if(a==='done'){markDone(el.dataset.id);return}
  if(a==='open'){openSheet(el.dataset.id);return}
  if(a==='undo'){undo();return}
  if(a==='timer'){const t=C.tasks.find(x=>x.id===el.dataset.id);timer={id:t.id,end:Date.now()+t.timer*60000};ding(false);render();return}
  if(a==='timer-stop'){timer=null;render();return}
  if(a==='sheet-close'){saveLesText();closeSheet();return}
  if(a==='tt-scroll'){const t=document.getElementById('tvarkarastis');if(t)t.scrollIntoView({block:'start'});return}
  if(a==='sys'){const r=rec(k,true);r.checks[el.dataset.sys]=!r.checks[el.dataset.sys];saveDay(k,null);renderSheet();render();return}
  if(a==='chip'){const i=document.getElementById('hw-input');i.value=el.dataset.text+': ';i.focus();return}
  if(a==='hw-add'){addHw();return}
  if(a==='hw-del'){const r=rec(k,true);r.hw.splice(+el.dataset.i,1);saveDay(k,null);renderSheet();render();return}
  if(a==='hw-tick'){const r=rec(k,true);const h=r.hw[+el.dataset.i];h.done=!h.done;saveDay(k,null);renderSheet();render();return}
  if(a==='les'){saveLesText();const r=rec(k,true),l=el.dataset.l;r.les[l]=Object.assign({},r.les[l],{s:el.dataset.s});saveDay(k,null);renderSheet();render();
    if(el.dataset.s==='hw'){const inp=[...document.querySelectorAll('.les-text')].find(x=>x.dataset.les===l);if(inp&&!inp.value)inp.focus()}return}
  if(a==='les-tick'){const r=rec(k,true),st=r.les[el.dataset.l];if(st){st.done=!st.done;saveDay(k,null)}renderSheet();render();return}
  if(a==='check-done'){saveLesText();const d=today(),r=rec(k);const t=C.tasks.find(x=>x.id===sheetFor);
    const lines=schoolLessons(d).map(l=>{const st=r.les[l]||{};return '• '+l+': '+(st.s==='hw'?(st.text||'užduota'):'nieko')}).concat(r.hw.map(h=>'• '+h.text));
    closeSheet();markDone(t.id,lines.length?'Rytojui:\n'+lines.join('\n'):'Užduota: nieko neįrašyta');return}
  if(a==='hw-done'||a==='hw-none'){const t=C.tasks.find(x=>x.id===sheetFor);closeSheet();markDone(t.id,a==='hw-none'?'Pažymėjo: nieko neužduota':null);return}
  if(a==='bag'){const r=rec(k,true);const it=el.dataset.item;r.bag[it]=!r.bag[it];saveDay(k,null);renderSheet();return}
  if(a==='bag-done'){const t=C.tasks.find(x=>x.id===sheetFor);closeSheet();markDone(t.id);return}
  // parent
  if(a==='tab'){if(tab==='set'&&dirty&&el.dataset.tab!=='set'){toast('Pirma išsaugokite nustatymus');return}tab=el.dataset.tab;if(tab==='set'&&!dirty)draft=null;render();scrollTo(0,0);return}
  if(a==='p-toggle'){const r=rec(k,true);const id=el.dataset.id;if(r.done[id])delete r.done[id];else r.done[id]=Date.now();saveDay(k,null);render();return}
  if(a==='tday'){const t=draft.tasks[+el.dataset.i];const dw=+el.dataset.d;t.days=t.days||[];t.days=t.days.includes(dw)?t.days.filter(x=>x!==dw):t.days.concat(dw);el.classList.toggle('on');markDirty();refreshSums();return}
  if(a==='tdel'){if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.textContent='Tikrai ištrinti?';return}draft.tasks.splice(+el.dataset.i,1);markDirty();renderParent();return}
  if(a==='tadd'){draft.tasks.push({id:'t'+Date.now().toString(36),icon:'⭐',title:'Nauja užduotis',pts:2,part:'vakaras',days:[1,2,3,4,5],type:'simple',timer:0});markDirty();renderParent();return}
  if(a==='save-config'){saveConfig();return}
  if(a==='copy'){const inp=document.getElementById(el.dataset.target);const v=inp.value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Nukopijuota')).catch(()=>{inp.select();toast('Pažymėta, nukopijuokite')});return}
  if(a==='tg-find'){tgFind();return}
  if(a==='tg-save'){tgSave();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hw-input'){e.preventDefault();addHw()}if(e.key==='Escape'&&sheetFor)closeSheet()});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function lessonItemsText(q){const m=Object.assign({},lessonMap(q));const all=[].concat(...Object.values(q.timetable||{}));all.forEach(l=>{if(!Object.keys(m).some(x=>x.trim().toLowerCase()===l.trim().toLowerCase()))m[l]=[]});return Object.entries(m).map(([l,a])=>l+': '+(a||[]).join(', ')).join('\n')}
function parseLessonItems(txt){const o={};txt.split('\n').forEach(line=>{const i=line.indexOf(':');if(i<1)return;const l=line.slice(0,i).trim();if(l)o[l]=line.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean)});return o}
function saveLesText(){const k=keyOf(today());let ch=false;document.querySelectorAll('.les-text').forEach(i=>{const r=rec(k,true),st=r.les[i.dataset.les];const v=i.value.trim().slice(0,120);if(st&&(st.text||'')!==v){st.text=v;ch=true}});if(ch)saveDay(k,null)}
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('les-text')){saveLesText();render()}});
function addHw(){const i=document.getElementById('hw-input');const v=(i.value||'').trim();if(!v||/:\s*$/.test(v)&&v.length<4)return;const k=keyOf(today()),r=rec(k,true);r.hw.push({text:v.slice(0,120),done:false});saveDay(k,null);renderSheet();render();const ni=document.getElementById('hw-input');if(ni)ni.focus()}
document.addEventListener('input',e=>{
  const el=e.target;if(!draft)return;
  if(el.dataset.cf){draft[el.dataset.cf]=el.value;markDirty();if(el.dataset.cf==='dailyMax')refreshSums()}
  else if(el.dataset.tr){draft.training=draft.training||{};if(el.value)draft.training[el.dataset.tr]=el.value;else delete draft.training[el.dataset.tr];markDirty();refreshSums()}
  else if(el.dataset.tt){draft.timetable=draft.timetable||{};draft.timetable[el.dataset.tt]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);draft.ttExample=false;markDirty()}
  else if(el.dataset.bag){draft.bagExtras=el.value.split('\n').map(s=>s.trim()).filter(Boolean);markDirty()}
  else if(el.dataset.li){draft.lessonItems=parseLessonItems(el.value);markDirty()}
  else if(el.dataset.ti){const t=draft.tasks[+el.dataset.ti];t[el.dataset.f]=el.value;markDirty();if(el.dataset.f==='pts')refreshSums()}
});
document.addEventListener('change',e=>{const el=e.target;if(draft&&el.dataset.ti&&el.dataset.f==='type'){draft.tasks[+el.dataset.ti].type=el.value;markDirty();renderParent()}});
function refreshSums(){const box=document.querySelector('.sums');if(!box||!draft)return;box.innerHTML=WEEK_ORDER.map(dw=>{const s=draft.tasks.filter(t=>t.type==='train'?!!(draft.training||{})[dw]:(t.days||[]).includes(dw)).reduce((a,t)=>a+(parseInt(t.pts,10)||0),0);return '<span class="'+(s===(parseInt(draft.dailyMax,10)||0)?'':'bad')+'">'+DAY_SHORT[dw]+' '+s+'</span>'}).join('')}

/* ---------- boot ---------- */
function showBadKey(){document.getElementById('app').innerHTML='<div class="center"><h2>Nuoroda neteisinga</h2><p>Atidarykite nuorodą, kurią gavote iš tėvų.</p></div>'}
let lastDay=keyOf(today());
function render(){
  if(!C)return;
  if(ROLE==='parent'){if(tab==='set'&&document.querySelector('.savebar'))return;renderParent()}
  else renderChild();
}
function renderForce(){if(ROLE==='parent'&&tab==='set'){renderParent();return}render()}
async function refresh(){
  const ok=await loadServer();if(!ok)return;
  if(ROLE==='parent'&&tab==='set')return;
  if(sheetFor){const a=document.activeElement;if(!(a&&a.tagName==='INPUT'&&a.closest('#sheet')))renderSheet()}
  render();
}
async function boot(){
  if(!KEY&&!DEMO){showBadKey();return}
  cacheLoad();
  if(C){render()}
  const ok=await loadServer();if(!ok)return;
  renderForce();
}
// keep fresh: poll while visible, catch day changes
setInterval(()=>{if(document.visibilityState!=='visible')return;if(keyOf(today())!==lastDay){lastDay=keyOf(today());closeSheet();timer=null;renderForce()}refresh()},20000);
setInterval(()=>{if(document.visibilityState==='visible'&&ROLE!=='parent'&&!sheetFor)render()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
window.addEventListener('online',flush);
boot();
})();
</script>
